<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Service Desk - Admin Login</title>

    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/admin-login.css">
    <link rel="stylesheet" href="../CSS/components.css">

</head>


<body>


<header>

    <h1>Service Desk</h1>

    <nav>
        <a href="../UserSide/home.html">
            Home
        </a>
    </nav>

</header>


<main>

    <section class="admin-login-container">

        <h2>Admin Login</h2>

        <p>
            Login to manage service requests.
        </p>


        <form id="adminLoginForm">


            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <button
                type="submit"
                id="loginButton">

                Login

            </button>


            <div
                id="loginMessage"
                class="login-message">

            </div>


        </form>

    </section>

</main>


<script src="../JavaScript/config.js"></script>

<script src="../JavaScript/admin-login.js"></script>


</body>

</html>
